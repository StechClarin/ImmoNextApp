# ==============================================================================
# Configuration Nginx pour Immovitrine (Next.js 14 Standalone via Docker)
# Port d'écoute interne de l'application : 127.0.0.1:8095
# ==============================================================================
# REMARQUE IMPORTANTE :
# Remplacez "immo.votredomaine.cg" par le domaine ou sous-domaine réel du projet
# (ex: immo.ethernanos.space, immovitrine.cg, etc.).
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name immo.votredomaine.cg www.immo.votredomaine.cg;

    # Taille maximale des téléversements (photos haute définition des biens)
    client_max_body_size 30M;

    # Fichiers de logs dédiés (évite de polluer les logs globaux)
    access_log /var/log/nginx/immovitrine_access.log;
    error_log /var/log/nginx/immovitrine_error.log;

    # Défi Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Optimisation du cache pour les fichiers statiques immuables de Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache long terme pour les images téléversées (servies dynamiquement par l'app)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy principal vers le conteneur Docker Immovitrine
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        # Support WebSockets & Next.js Streaming / HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # En-têtes essentiels pour la détection de session sécurisée (HTTPS)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;

        # Délais d'expiration confortables pour les requêtes lourdes / imports
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

